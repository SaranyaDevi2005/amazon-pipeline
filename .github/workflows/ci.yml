name: Databricks CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Databricks test job
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
            "${{ secrets.DATABRICKS_HOST }}/api/2.1/jobs/run-now" \
            -d '{"job_id": ${{ secrets.DATABRICKS_JOB_ID }}}'
